server:
  port: 8080
app:
  cors:
    allowed-origins: http://localhost:5173
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                  - Path=/api/v1/products/**