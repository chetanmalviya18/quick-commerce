server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quickcommerce_user_db}
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:0000}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  jwt:
    issuer: quickcommerce-user-service
    access-token-minutes: 15
    refresh-token-days: 7
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:../keys/private-pkcs8.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:../keys/public.pem}

logging:
  file:
    name: logs/user-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: WARN
    com.quickcommerce: INFO
    com.netflix: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    com.zaxxer.hikari: WARN