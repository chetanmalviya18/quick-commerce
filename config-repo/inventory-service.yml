server:
  port: 8082
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quickcommerce_inventory_db}
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:0000}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json
logging:
  file:
    name: logs/user-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: WARN
    com.quickcommerce: INFO
    com.netflix: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    com.zaxxer.hikari: WARN