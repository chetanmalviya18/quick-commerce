server:
  port: 8082
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quickcommerce_inventory_db}
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:0000}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json